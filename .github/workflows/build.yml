name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          for z in CodexAyat*.zip; do unzip -o -q "$z"; done
      - name: Add voice pack
        run: |
          if [ -f voices.zip ]; then
            mkdir -p CodexAyat/app/src/main/assets
            cp voices.zip CodexAyat/app/src/main/assets/voices.zip
          fi
      - run: gradle -p CodexAyat assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAyat-apk
          path: CodexAyat/app/build/outputs/apk/debug/app-debug.apk
